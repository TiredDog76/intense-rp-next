{% from "macros.html" import web_button %}
<section class="view hotswap-view" data-view="loadout-switch">
  <div class="hotswap-view__panel loadout-switch-panel">
    <h1 class="hotswap-view__title">Select Loadout</h1>
    <div id="loadout-provider-block" class="loadout-provider-block hidden">
      <span class="loadout-provider-block__label">Provider</span>
      <div id="loadout-provider-dropdown" class="custom-select">
        <button id="loadout-provider-button" class="custom-select__button" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="custom-select__value">
            <span class="custom-select__icon" aria-hidden="true">
              <img id="loadout-provider-button-icon" src="" alt="">
            </span>
            <span id="loadout-provider-button-label" class="custom-select__label"></span>
          </span>
          <span class="custom-select__chevron" aria-hidden="true">
            <img src="{{ asset_urls.icons.chevron_down }}" alt="">
          </span>
        </button>
        <div id="loadout-provider-menu" class="custom-select__menu" role="listbox" aria-hidden="true"></div>
      </div>
    </div>
    <div id="loadout-switch-list" class="model-switch-list loadout-switch-list"></div>
    <div id="loadout-switch-footer" class="loadout-switch-footer">
      {{ web_button("loadout-switch-back-button", "Back", variant="secondary") }}
      {{ web_button("loadout-switch-confirm-button", "Confirm", variant="accent", icon_url=asset_urls.icons.check, icon_alt="Confirm") }}
    </div>
    <p id="loadout-switch-status" class="status-text"></p>
  </div>
</section>
