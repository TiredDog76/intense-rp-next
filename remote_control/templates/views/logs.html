{% from "macros.html" import app_header, web_button %}
<section class="view logs-view" data-view="logs">
  {{ app_header(asset_urls) }}
  <div class="console-card">
    <div id="console-output" class="console-output" aria-live="polite">
      <div id="console-placeholder" class="console-output__placeholder">Loading</div>
    </div>
  </div>
  <p id="logs-status" class="status-text"></p>
  {{ web_button("logs-footer-button", "Back", variant="secondary") }}
</section>
