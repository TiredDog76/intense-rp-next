site_name: IntenseRP Next v2
site_description: Documentation for IntenseRP Next v2
# Read the Docs sets READTHEDOCS_CANONICAL_URL (includes /en/<version>/).
# Use a fallback so local builds still get a stable site_url.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, https://intense-rp-next.readthedocs.io/en/latest/]

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features:
      - Overview: features.md
      - Formatting: features/formatting.md
      - STMP Support: features/stmp-support.md
      - DeepSeek Behavior: features/deepseek-behavior.md
      - Login & Sessions: features/login-sessions.md
      - Network & API: features/network-api.md
      - Console & Logging: features/console-logging.md
      - System: features/system.md
  - Advanced:
      - Overview: advanced.md
      - Provider Support: advanced/provider-support.md
      - API Behavior: advanced/api-behavior.md
  - Migration Guide: migration.md
  - Help & Support: 
      - Troubleshooting: hands/troubleshooting.md
      - Contact: hands/contact.md
      - FAQ: hands/faq.md

theme:
  name: material
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
