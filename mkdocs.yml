site_name: IntenseRP Next v2
site_description: Documentation for IntenseRP Next v2
# Read the Docs sets READTHEDOCS_CANONICAL_URL (includes /en/<version>/).
# Use a fallback so local builds still get a stable site_url.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, https://intense-rp-next.readthedocs.io/en/latest/]
repo_name: LyubomirT/intense-rp-next
repo_url: https://github.com/LyubomirT/intense-rp-next
edit_uri: edit/v2-rewrite/docs/

# NOTE:
# DESPITE BEING CALLED mkdocs.yml,
# WE USE ZENSICAL FOR DOCS GENERATION.

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Migration Guide: migration.md
  - Features:
      - Overview: features.md
      - Accounts & Credentials: features/accounts.md
      - Formatting: features/formatting.md
      - STMP Support: features/stmp-support.md
      - DeepSeek Behavior: features/deepseek-behavior.md
      - GLM Behavior: features/glm-behavior.md
      - Kimi Behavior: features/moonshot-behavior.md
      - QwenLM Behavior: features/qwen-behavior.md
      - Login & Sessions: features/login-sessions.md
      - Network & API: features/network-api.md
      - Console & Logging: features/console-logging.md
      - Hotswaps: features/hotswaps.md
      - System: features/system.md
  - Experimental:
      - Overview: experimental.md
      - Better Model Names: experimental/better-model-names.md
  - Advanced:
      - Overview: advanced.md
      - Provider Support: advanced/provider-support.md
      - API Behavior: advanced/api-behavior.md
      - GLM Quirks: advanced/glm-quirks.md
      - App Flags: advanced/app-flags.md
  - Util Reference:
      - Overview: util-reference.md
      - Help & Extras: util-reference/help-extras.md
      - Backup & Import Settings: util-reference/backup-import-settings.md
      - STMP Patcher: util-reference/stmp-patcher.md
      - Contributors: util-reference/contributors.md
  - Help & Support: 
      - Troubleshooting: hands/troubleshooting.md
      - Contact: hands/contact.md
      - Support the Project: hands/support.md
      - FAQ: hands/faq.md

theme:
  name: material
  variant: modern
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - navigation.top
    - content.action.edit
    - content.action.view
    - content.code.copy

plugins:
  - search
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      exclude:
        - index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
